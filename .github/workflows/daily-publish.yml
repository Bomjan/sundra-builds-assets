name: Sundra Builds daily publishing
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sundra-builds-daily
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate, validate, commit, publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          FACEBOOK_PAGE_ID: '1304976722709656'
          UPLOAD_POST_PROFILE: default
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/publish.py
      - name: Push published records
        if: always()
        run: |
          git config user.name "sundra-builds-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts records || true
          if ! git diff --cached --quiet; then
            git commit -m "Record Sundra Builds daily publishing"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
