<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#10171c"/><text x="72" y="100" fill="#a6f3d4" font-size="28" font-family="Arial" letter-spacing="7">SUNDRA BUILDS / JAVA DSA</text><text x="72" y="225" fill="#ffffff" font-family="Arial" font-size="75" font-weight="bold">Binary Search</text><text x="72" y="310" fill="#ffffff" font-family="Arial" font-size="75" font-weight="bold">cuts the work in half.</text><text x="72" y="385" fill="#a9b6be" font-family="Arial" font-size="30">A sorted array. One target. Two approaches.</text><rect x="55" y="465" width="970" height="310" rx="24" fill="#202b32"/><text x="88" y="540" fill="#ffaaa5" font-size="43" font-family="Arial" font-weight="bold">LINEAR SEARCH</text><text x="88" y="600" fill="#d3dde3" font-size="29" font-family="Arial">Checks elements one by one</text><text x="88" y="708" fill="#ffffff" font-size="90" font-family="Arial" font-weight="bold">O(n)</text><text x="480" y="702" fill="#a9b6be" font-size="27" font-family="Arial">1,000,000 items</text><text x="480" y="741" fill="#ffaaa5" font-size="29" font-family="Arial">up to 1,000,000 checks</text><rect x="55" y="800" width="970" height="320" rx="24" fill="#203b38"/><text x="88" y="875" fill="#a6f3d4" font-size="43" font-family="Arial" font-weight="bold">BINARY SEARCH</text><text x="88" y="930" fill="#d3dde3" font-size="29" font-family="Arial">Halves the remaining search range</text><text x="88" y="1042" fill="#ffffff" font-size="85" font-family="Arial" font-weight="bold">O(log n)</text><text x="570" y="1030" fill="#a9b6be" font-size="27" font-family="Arial">1,000,000 items</text><text x="570" y="1071" fill="#a6f3d4" font-size="29" font-family="Arial">at most 20 checks</text><rect x="55" y="1150" width="970" height="130" rx="22" fill="#a6f3d4"/><text x="90" y="1205" fill="#10171c" font-family="Arial" font-size="32" font-weight="bold">THE CATCH: DATA MUST BE SORTED.</text><text x="90" y="1250" fill="#243d37" font-family="Arial" font-size="25">Java: Arrays.binarySearch(sortedArray, target)</text></svg>